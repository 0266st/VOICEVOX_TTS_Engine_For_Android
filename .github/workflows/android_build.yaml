name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# 既定では読み取りだけにする。書き込みが要る処理（リリースなど）は、そのジョブにだけ権限を足す
permissions:
  contents: read

# 同じ PR の古い実行は、新しい push で止める（master への push は止めない）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わるので、バージョンを固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Setup VOICEVOX
        run: |
          ./gradlew :app:downloadVoicevox
      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest
      - name: Build With Gradle
        run: |
          ./gradlew assembleDebug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          # zip にせず、APK をそのままアップロードする（名前は app-debug.apk になる）
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          retention-days: 14
