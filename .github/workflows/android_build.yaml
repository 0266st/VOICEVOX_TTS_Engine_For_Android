name: Pull Request

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.pull_request.head.sha }}
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: adopt
          java-version: 17
          cache: gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Setup VOICEVOX
        run: |
          ./gradlew :app:downloadVoicevox
      - name: Build With Gradle
        run: |
          ./gradlew assembleDebug
      - name: Upload Artifacts
        uses: actions/upload-artifacts@v4
        with:
          name: apk
          path: app/build/intermediates/apk/debug/app-debug.apk
